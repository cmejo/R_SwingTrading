name: Daily Swing Trading Scanner & Email Alert

on:
  schedule:
    # 20:30 UTC = 4:30 PM EDT (Monday through Friday)
    - cron: '30 20 * * 1-5'
  workflow_dispatch: # Allows manual one-click execution from GitHub Actions tab

permissions:
  contents: write
  issues: write

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install System Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev gfortran

      - name: Cache R Packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-swing-${{ hashFiles('**/symbols.txt') }}
          restore-keys: |
            ${{ runner.os }}-r-swing-

      - name: Install Required R Packages
        run: |
          Rscript -e '
            needed <- c("xts", "zoo", "quantmod", "TTR", "glmnet", "tseries", "jsonlite")
            new_pkgs <- needed[!(needed %in% installed.packages()[, "Package"])]
            if (length(new_pkgs) > 0) install.packages(new_pkgs, repos = "https://cloud.r-project.org")
          '

      - name: Run Daily Swing Scanner
        run: |
          mkdir -p output logs data
          Rscript daily_signal.R --symbols_file=symbols.txt --capital=10000 --max_pos=5 > LATEST_TICKET.txt 2>&1
          cat LATEST_TICKET.txt

      - name: Run Weekly/Monthly Evaluation (Fridays)
        run: |
          DAY_OF_WEEK=$(date +%u)
          if [ "$DAY_OF_WEEK" -eq 5 ] || [ ! -f "output/MONTHLY_EVALUATION.txt" ]; then
            Rscript monthly_review.R --symbol=SNDK --days=30 > output/MONTHLY_EVALUATION.txt 2>&1 || true
          fi

      - name: Set Date String
        run: echo "TODAY=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Send Email Alert via Direct SMTP (if configured)
        if: env.SMTP_USER != '' && env.SMTP_PASS != ''
        uses: dawidd6/action-send-mail@v3
        env:
          SMTP_USER: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASS: ${{ secrets.SMTP_PASSWORD }}
        with:
          server_address: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.SMTP_PORT || 465 }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Daily Swing Trading Ticket - ${{ env.TODAY }}"
          to: christopher@cmejo.com
          from: "Swing Trading Bot <${{ secrets.SMTP_USERNAME }}>"
          body: file://LATEST_TICKET.txt
          attachments: LATEST_TICKET.txt

      - name: Send Email via GitHub Notification Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Close prior automated ticket issues to keep repository clean
          gh issue list --state open --label "daily-ticket" --json number -q '.[].number' | while read -r num; do
            gh issue close "$num" --comment "Closed by daily automated runner." || true
          done

          # Create new daily ticket issue (triggers automatic email notification to christopher@cmejo.com)
          gh issue create \
            --title "Daily Swing Trade Ticket: ${{ env.TODAY }}" \
            --body-file LATEST_TICKET.txt \
            --label "daily-ticket"

      - name: Commit and Push Updated Tickets & Portfolio Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add LATEST_TICKET.txt portfolio.json data/*.rds output/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(daily): automated scanner update [$(date +'%Y-%m-%d')]"
            git push origin main
          fi
